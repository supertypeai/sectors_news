name: IDX News Pipeline 

on:
  # Superseded by Cloud Run. This pipeline now runs as
  # sectors-news-idx-job / sectors-news-idx-4hourly in datasheet-398802 (us-central1),
  # on this same cron. See deployments/README.md.
  #
  # Do not re-enable without first pausing the Cloud Scheduler job: the two
  # keep separate watermarks (git here, a GCS bucket there), so both would
  # scrape the same window, both pay for the same LLM calls, and both race
  # to insert. workflow_dispatch is left on as a manual escape hatch.
  # schedule:
    # - cron: "15 */4 * * *" # every 4 hours UTC (15 minutes later)
  workflow_dispatch:
    inputs:
      process_only:
        description: "Resume: skip scraping and process the committed work-list (use after a processing crash)"
        type: boolean
        default: false

concurrency:
  group: news-data-pipeline
  cancel-in-progress: false
  queue: max

jobs:
  idx_pipeline:
    name: IDX Scrape & Process
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e .

      - name: Set up Google Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          # hardcode version to ensure bca works
          chrome-version: '1586874'
          # also installs the matching ChromeDriver binary
          install-chromedriver: true

      - name: Install Scrapling Browser Binaries
        run: |
          uv run scrapling install
          
      - name: Scrape and build work-list (ingestion)
        if: ${{ !inputs.process_only }}
        run: |
          uv run -m scraper_engine.pipeline main_idx --scrape-only
        env: &pipeline_env
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY_DEV: ${{ secrets.GROQ_API_KEY_DEV }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROXY: ${{ secrets.PROXY }}

      # Checkpoint the ingestion result BEFORE processing, so a runner crash
      # mid-processing never forces a re-scrape. A re-run resumes from here
      - name: Checkpoint ingestion data
        if: ${{ success() && !inputs.process_only }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/idx/pipeline.json data/idx/pipeline_filtered.json data/idx/pipeline_yesterday.json data/last_state.json
          git diff-index --quiet HEAD || git commit -m "chore(idx): checkpoint ingested articles"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process all batches
        run: |
          BATCH_SIZE=30
          TOTAL=$(python3 -c "import json; print(len(json.load(open('./data/idx/pipeline_filtered.json'))))")
          BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "Total articles: $TOTAL → $BATCHES batches needed"

          for BATCH in $(seq 1 $BATCHES); do
            echo "=== B${BATCH} ==="
            uv run -m scraper_engine.pipeline main_idx --process-only --batch $BATCH --batch-size $BATCH_SIZE
            sleep 20
          done

          echo "=== CLEANUP ==="
          uv run -m scraper_engine.pipeline remove_outdated_news --table-name idx_news
        env: *pipeline_env

      - name: Save generated IDX data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idx-generated-data-${{ github.run_id }}
          path: |
            data/idx/pipeline.json
            data/idx/pipeline_filtered.json
            data/idx/pipeline_yesterday.json
            data/last_state.json
            data/outdated_news.json
          if-no-files-found: warn
          retention-days: 60
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore(idx): update scraped news data"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
