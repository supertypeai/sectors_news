description: IDX news — scrape, checkpoint, process in batches, prune

container:
  image: sectors-news-runtime:latest
  pull_policy: never
  working_dir: /workspace
  volumes:
    # Chrome dies partway through a page on the container default of 64 MiB,
    # and Dagu's container config has no shm_size.
    - /dev/shm:/dev/shm
    - /srv/runners/tokens/sectors_news:/run/secrets:ro
  env:
    - GIT_CONFIG_VALUE_1: '!f() { test "$1" = get && echo username=x-access-token && echo password="$(cat /run/secrets/token)"; }; f'
    - MARKET: idx
    - PIPELINE_COMMAND: main_idx
    - TABLE_NAME: idx_news
    - WORK_LIST: data/idx/pipeline_filtered.json
    - CHECKPOINT_FILES: >-
        data/idx/pipeline.json
        data/idx/pipeline_filtered.json
        data/idx/pipeline_yesterday.json
        data/last_state.json
    - CLEANUP_ARGS: ""
    - BATCH_SIZE: "30"
    - BATCH_PAUSE_SECONDS: "20"
    - GIT_AUTHOR_NAME: plumbersai[bot]
    - GIT_AUTHOR_EMAIL: 325179815+plumbersai[bot]@users.noreply.github.com
    - GIT_COMMITTER_NAME: plumbersai[bot]
    - GIT_COMMITTER_EMAIL: 325179815+plumbersai[bot]@users.noreply.github.com

secrets:
  - SUPABASE_URL
  - SUPABASE_KEY
  - OPENROUTER_API_KEY
  - GROQ_API_KEY_DEV
  - PROXY

schedule: "15 */4 * * *"
queue: news-data-pipeline
timeout_sec: 10800
hist_retention_days: 30

steps:
  - id: checkout
    retry_policy:
      limit: 3
      interval_sec: 30
    run: >-
      bash -c 'set -e;
      git clone --branch "$GIT_BRANCH" "$GIT_REMOTE" .;
      git reset --hard "$GIT_SHA"'

  - id: preflight
    depends: [checkout]
    run: bash .dagu/steps/preflight.sh

  - id: scrape
    depends: [preflight]
    run: bash -c 'set -e; python -m scraper_engine.pipeline "$PIPELINE_COMMAND" --scrape-only'

  - id: checkpoint
    depends: [scrape]
    retry_policy:
      limit: 3
      interval_sec: 30
      backoff: true
      max_interval_sec: 120
    run: bash .dagu/steps/commit.sh checkpoint

  # If this fails, do not re-run the DAG — the watermark advanced at scrape
  # time, so a second scrape overwrites the work-list with an empty list.
  # Start sectors_news--idx-news-resume instead.
  - id: process
    depends: [checkpoint]
    run: bash .dagu/steps/process.sh

  - id: publish
    depends: [process]
    retry_policy:
      limit: 3
      interval_sec: 30
      backoff: true
      max_interval_sec: 120
    run: bash .dagu/steps/commit.sh publish
